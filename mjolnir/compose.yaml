# mjolnir — Caddy, postgres, hub, builder.
#
# This file still stands alone (`cd mjolnir && docker compose up` works), and
# the root `compose.yaml` `include:`s it alongside every other project so a
# deploy is one `git pull` + one `docker compose up` (D94, now one repository).
# One repository means ONE Compose project and ONE default network: the
# `tun-shared` external network, its `external: true` declaration and the
# one-time `docker network create tun-shared` (D98/D104) are gone — sibling
# services resolve each other by service name with no configuration at all.
#
# Values used by more than one project (TUN_SITE_ADDRESS, TUN_PUBLIC_BASE,
# OTA_TOKEN, OPERATOR_AUTH_TOKEN, MJOLNIR_POSTGRES_PASSWORD, STABBUR_AUTH_TOKEN) live
# in the ROOT `.env` and are interpolated below. Values used only by mjolnir
# live in `mjolnir/.env` (see .env.example) and are passed through via
# `env_file`. No value is typed in two files.
#
# D-H6: OPERATOR_AUTH_TOKEN gates hub's/builder's own operator routes; it is
# NOT optional for a real deploy (Caddy exposes both publicly at /mjolnir/*
# and /builder/*) even though each service's own config loader treats it as
# optional for local/dev ergonomics.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # PRODUCTION port shape. These are correct only when TUN_SITE_ADDRESS is a
    # hostname, because that is what makes Caddy listen on 80/443 and obtain a
    # certificate. The two settings are NOT coupled by Compose, and getting
    # them out of step is silent: with the documented local value
    # `TUN_SITE_ADDRESS=:8080` Caddy listens on 8080 inside the container,
    # nothing is published on 8080, and the gateway is simply unreachable from
    # the host — on a rootless-Docker host `up` fails outright instead
    # ("cannot expose privileged port 80"). Found by a real boot test, 2026-11-13.
    #
    # For local plain-HTTP work use the root `compose.dev.yaml`, which
    # overrides these three mappings to one loopback 8080:
    #     docker compose -f compose.yaml -f compose.dev.yaml up
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      # Site address: a hostname in production (auto-HTTPS), ":8080" locally —
      # and locally you must also use compose.dev.yaml, see the ports note above.
      TUN_SITE_ADDRESS: ${TUN_SITE_ADDRESS:?set TUN_SITE_ADDRESS in the root .env}
      OTA_TOKEN: ${OTA_TOKEN:?set OTA_TOKEN in the root .env}
      # The /stabbur, /smia and /phonexa upstreams are no longer configurable:
      # caddy/Caddyfile names those services directly, because one repository
      # is one Compose project and the names always resolve.
      #
      # PHONEXA_AUTH_HASH is mjolnir's alone (only this Caddy consumes it) so
      # it lives in mjolnir/.env, but it is read here as `${VAR:-default}`
      # rather than via env_file: the default is a verbatim copy of the
      # Caddyfile's own fail-closed default (a bcrypt hash of a random string
      # generated once and discarded), so an unconfigured deploy rejects every
      # /phonexa request instead of serving phonexa open. `$` is escaped as
      # `$$` so compose emits the literal hash.
      #
      # The valueless pass-through form (`PHONEXA_AUTH_HASH:` with nothing
      # after the colon) must NOT be used here: under `include:` it resolves
      # to null and is dropped from the container entirely, Caddy falls back
      # to its locked default, and every login 401s with a perfectly valid
      # hash sitting in .env (found live 2026-11-13).
      PHONEXA_AUTH_HASH: ${PHONEXA_AUTH_HASH:-$$2a$$14$$4O3NlHoGMD2./6FpyxpKAell6n5PkW1TaayAPbIKyg4GgwZfc8ESO}
    volumes:
      # Relative paths in an included file resolve against THIS file's
      # directory (verified 2026-11-13), so these stay `./…` under both the
      # root `include:` and standalone `cd mjolnir`.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/srv:ro                   # served read-only; publishing writes from the host
      - caddy_data:/data                 # TLS certs — LOSING THIS MEANS RE-ISSUING CERTS
      - caddy_config:/config

  mjolnir-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${MJOLNIR_POSTGRES_PASSWORD:?set MJOLNIR_POSTGRES_PASSWORD in the root .env}
      POSTGRES_USER: mjolnir
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately NOT published to the host: only sibling containers reach it.
    healthcheck:
      # -d postgres is required: pg_isready with no -d defaults to a database
      # named after -U's value ("mjolnir"), which doesn't exist — POSTGRES_DB
      # above is "postgres". Harmless to the healthcheck's pass/fail result
      # (pg_isready still reports the server as accepting connections even
      # when the probed database doesn't exist) but spams
      # `FATAL: database "mjolnir" does not exist` into the logs forever,
      # every 10s, drowning out real problems.
      test: ["CMD-SHELL", "pg_isready -U mjolnir -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # hub-builder-operator-console: hub owns the schema (`card_slots`,
  # `decks`, `publications`, `build_jobs`, `occurrence_shipments`,
  # `pending_occurrences`, `builder_config`, `job_logs`); builder is the
  # only other writer — both point at the same logical database (02-
  # services.md's "separate logical DB per service" is per *ecosystem*
  # service, not split further between these two, which already share
  # everything by design, D-P3). Bind-mounted, not copied into the image —
  # own `Dockerfile`s install deps at build time; source comes from the
  # checkout, not a layer, so `git pull` + restart is enough.
  #
  # The build context is the REPOSITORY ROOT (`..`), not mjolnir, so a later
  # change can `COPY` from shared `libs/`. Both Dockerfiles' COPY paths are
  # mjolnir/-prefixed to match. A root `.dockerignore` is mandatory: the
  # combined working tree is ~10 GB.
  mjolnir-hub:
    build:
      context: ..
      dockerfile: mjolnir/hub/Dockerfile
    restart: unless-stopped
    depends_on:
      mjolnir-postgres:
        condition: service_healthy
    # mjolnir's own values (ALLOW_HTTP, ALLOW_NO_COMPANION, SOURCE_LANG, …).
    # Shared and derived values are set in `environment:` below. Not
    # required: every mjolnir-local value is optional with a working
    # default, so a fresh clone with no mjolnir/.env still comes up.
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql://mjolnir:${MJOLNIR_POSTGRES_PASSWORD:?set MJOLNIR_POSTGRES_PASSWORD in the root .env}@mjolnir-postgres:5432/postgres
      DATA_DIR: /app/data
      TUN_PUBLIC_BASE: ${TUN_PUBLIC_BASE}
      OPERATOR_AUTH_TOKEN: ${OPERATOR_AUTH_TOKEN}
      # Derived, never typed: service names resolve, and stabbur's browser-
      # facing UI is this site's own /stabbur/ui route through Caddy. The two
      # are NOT interchangeable — the first is an in-container fetch
      # (pullNotes/pullGrammarRules), the second is a link a human clicks.
      STABBUR_BASE_URL: http://stabbur-backend:5056
      STABBUR_UI_BASE: ${TUN_PUBLIC_BASE}/stabbur/ui
      # Shared with stabbur itself (D85) — root .env until unified-auth
      # replaces it with one INTERNAL_TOKEN.
      STABBUR_AUTH_TOKEN: ${STABBUR_AUTH_TOKEN}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/hub/node_modules
    healthcheck:
      # monorepo-merge 4.4: same four-key shape as phonexa-backend's reference
      # healthcheck. The *predicate* has to differ, and here is why.
      #
      # hub has no unauthenticated health route. src/auth.js's requireAuth()
      # gates every path except its one carve-out, /mjolnir/login (D-H6), and
      # answers a rejected request with 401 for anything under /api/ and a 302
      # to the login page otherwise. /mjolnir/login is not reliably 200 either:
      # src/server.js only mounts it when OPERATOR_AUTH_TOKEN is set, and falls
      # through to the normal route list (404) when it is unset for local/dev.
      #
      # So this probe asserts liveness, not success: it passes on ANY HTTP
      # status line. A 200, a 302 to /mjolnir/login, a 401 and a 404 all prove
      # the same thing — the node process is up, accepting connections and
      # routing. Only a connection refusal, a hang or a crashed process fails
      # it. Deliberately weaker than phonexa's /ping check, because a
      # strictly-stronger one here could only be made to pass by opening an
      # unauthenticated route, which is a behaviour change this change does not
      # make.
      #
      # node, not curl: this image is node:22-alpine + bash only (builder's has
      # curl, hub's does not), and `node -e` is CommonJS by default so
      # require() is fine. 127.0.0.1 rather than localhost: the server binds
      # all interfaces and the literal skips any IPv6-first resolution.
      test: ["CMD", "node", "-e", "const r=require('http').get({host:'127.0.0.1',port:8000,path:'/mjolnir/login'},s=>process.exit(s.statusCode?0:1));r.setTimeout(3000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mjolnir-builder:
    build:
      context: ..
      dockerfile: mjolnir/builder/Dockerfile
    restart: unless-stopped
    depends_on:
      mjolnir-postgres:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql://mjolnir:${MJOLNIR_POSTGRES_PASSWORD:?set MJOLNIR_POSTGRES_PASSWORD in the root .env}@mjolnir-postgres:5432/postgres
      DATA_DIR: /app/data
      TUN_PUBLIC_BASE: ${TUN_PUBLIC_BASE}
      OPERATOR_AUTH_TOKEN: ${OPERATOR_AUTH_TOKEN}
      STABBUR_BASE_URL: http://stabbur-backend:5056
      STABBUR_AUTH_TOKEN: ${STABBUR_AUTH_TOKEN}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/builder/node_modules
    healthcheck:
      # Same shape and same liveness-not-success predicate as mjolnir-hub's
      # above, for the same reason: builder/src/auth.js is hub's auth.js, and
      # builder/src/server.js gates every route behind it except /builder/login
      # — which, again, only exists while OPERATOR_AUTH_TOKEN is set. Any HTTP
      # status proves the node process is alive and routing; only a refused
      # connection or a hang fails the check.
      #
      # node rather than curl even though this image does install curl (for
      # ffmpeg-adjacent ops scripting): keeping the probe byte-for-byte hub's,
      # modulo the port and path, is the point of 4.4.
      test: ["CMD", "node", "-e", "const r=require('http').get({host:'127.0.0.1',port:8001,path:'/builder/login'},s=>process.exit(s.statusCode?0:1));r.setTimeout(3000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  # Explicit `name:` (not left to default to "<project>_<key>") so the
  # actual Docker volume is the SAME one regardless of which project
  # references it. Without this, running via `cd mjolnir && docker compose
  # up` creates `mjolnir_postgres_data`, while running the identical file
  # through the root `compose.yaml`'s `include:` creates a *different*
  # volume, `tun_postgres_data` — confirmed live: every card_slots/decks/
  # publications row silently "disappeared" switching between the two
  # entry points, because they were never in the same volume at all. Same
  # Docker-level cause as D98's networks needing an explicit shared name;
  # unnamed volumes have the identical per-project-prefix problem.
  # THESE NAMES ARE LOAD-BEARING AND MUST NOT CHANGE: mjolnir_caddy_data
  # holds the TLS certificates.
  caddy_data:
    name: mjolnir_caddy_data
  caddy_config:
    name: mjolnir_caddy_config
  postgres_data:
    name: mjolnir_postgres_data
