# The shared cluster (D155). This project does not run its own Postgres:
# `include:` pulls in the one cluster, which holds one database and one role
# per service. The same fragment included by several projects deduplicates, so
# `docker compose up shadow-backend` still starts the cluster and this service
# and nothing else.
#
# The `shadow` database and the `shadow` role already existed before this
# service did — postgres-consolidation created all five up front, and this one
# sat empty waiting for the split (D155).
include:
  - ../postgres/compose.yaml

# shadow's own stack — usable standalone (`docker compose up -d` here) and as
# one of the files the root compose.yaml `include:`s.
#
# Service name `shadow-backend`: <project>-<role>, so the compose key and the
# network hostname are the same string, and `include:` merging it into the
# unified stack cannot collide with anyone (D94/D118 — `include:` flattens
# everything into one namespace and silently keeps only the FIRST definition
# of a colliding name).
#
# Host port publishing lives in compose.override.yaml, which Compose loads
# only when you run from inside this directory. See the comment there.
services:
  shadow-backend:
    build:
      # Context is the repository root so a service can COPY from shared
      # libraries; every COPY in the Dockerfile is therefore shadow/-prefixed.
      # Paths in an included file resolve relative to this file.
      context: ..
      dockerfile: shadow/Dockerfile
    restart: unless-stopped
    depends_on:
      # Waits for the BOOTSTRAP, not merely a healthy server: a failed
      # bootstrap must stop this service starting against a cluster with no
      # databases, rather than letting it fail later with an auth error.
      postgres-init:
        condition: service_completed_successfully
    environment:
      # Derived, never typed: the role password is "<POSTGRES_PASSWORD>_shadow",
      # created by postgres/init/bootstrap.sh from the same one value.
      DATABASE_URL: postgresql+psycopg2://shadow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}_shadow@postgres:5432/shadow
      # Speech-to-text is proxied to smia (stt-via-smia). The address is
      # derived from smia's service key, never configured. The token is
      # shared with smia, so it comes from the root .env; it is server-side
      # only and never sent to the browser. Empty token = the 📝 action
      # reports "not configured" and everything else keeps working.
      #
      # These two moved here from phonexa with /transcribe: phonexa no longer
      # calls smia at all.
      SMIA_BASE_URL: http://smia-backend:5055
      # unified-auth 4.6: ONE service-to-service token, replacing STABBUR_AUTH_TOKEN
      # and SMIA_AUTH_TOKEN. NO `:-changeme` default — an unset value must fail
      # CLOSED (libs/pyservice/auth.py rejects when the configured token is empty),
      # and a publicly-known fallback is the opposite of that.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Profiles, settings and Praat analysis still belong to phonexa; shadow
      # proxies them server-side (see phonexa_client.py). Derived from
      # phonexa's service key, never configured.
      PHONEXA_BASE_URL: http://phonexa-backend:5050
      # Where phonexa is in the BROWSER's URL space — a different thing from
      # the internal address above, and the only phonexa value that reaches
      # the page. Used for the "← Vowel Chart" / "✎ Edit languages" links and
      # the Formant Lab handoff. It is the gateway's own mount point for
      # phonexa, so it is derived from the Caddyfile, not configured.
      PHONEXA_PUBLIC_PREFIX: /phonexa
      # Python's answer to jsservice's /libs mount: shared code goes on the
      # import path, since Python has no file-relative import. /libs (not
      # /app/libs) keeps the one spelling `pyservice.bootstrap` working in the
      # container and in a native venv (PYTHONPATH=../libs from here).
      PYTHONPATH: /libs
      # Where the Opus masters and the chapter-chunk cache live, inside the
      # named volume below. Used by exactly one project, so it is typed here
      # and nowhere else (D151); audio.py's default matches for a native run.
      SHADOW_AUDIO_DIR: /data/audio
    volumes:
      # Read-only shared code. One relative import must resolve both in the
      # repo and in the container.
      - ../libs:/libs:ro
      # THE AUDIO VOLUME. This comment used to read "The ONLY mount, and it
      # is read-only shared code. No audio volume, deliberately
      # (zone-isolation task 3.4): shadow stores no audio at all". That was
      # true until 2026-11-15 and is now REVERSED, deliberately and by the
      # operator (shadow-studying-mode; see the new ADR row in
      # docs/07-decisions.md and the annotation on D147).
      #
      # WHY the reversal: studying moved to the phone, and a browser that
      # has to hold a multi-hour file locally cannot serve a phone — no File
      # System Access API, no resume, no shared place in the book.
      #
      # WHY IT IS SAFE: what was originally reverted was server-side
      # DECODING PER REQUEST. This volume holds ONE mono Opus master per
      # book, transcoded once on upload, plus a derivable chapter-chunk
      # cache cut by stream copy. Nothing is decoded per request and nothing
      # is stored per sentence.
      #
      # WHAT IS STILL TRUE: the learner's recordings are never written here
      # (no endpoint accepts them), phonexa's audio tree is still phonexa's
      # alone, and THIS VOLUME IS DELIBERATELY NOT IN THE BACKUP SET —
      # masters are multi-GB and re-uploadable, while the irreplaceable
      # things (configs, boundaries, progress, cursor, transcripts) are rows
      # in the `shadow` database, which backup/ already dumps.
      - shadow_audio:/data/audio
    healthcheck:
      # Serving is not ready (zone-isolation). /ping still exists and still
      # returns 200 unconditionally — which is why it is NOT the probe: it
      # proves the process is alive, and with serve-before-migrate being
      # alive no longer implies having a schema.
      #
      # /_health answers 200 ready / 503 degraded (libs/pyservice/bootstrap.py).
      # shadow has no auth gate of its own, so nothing to exempt here.
      # python:3.12-slim has no curl; the shared script uses urllib and
      # prints the body, so .State.Health.Log carries the reason.
      test: ["CMD", "python", "/libs/pyservice/healthcheck.py", "http://localhost:5051/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# shadow's own data store, new with shadow-studying-mode. Named (not a bind)
# so it is Docker's to manage, and NOT added to backup/'s mirror set — see
# the long note on the mount above for why that is the right call and not an
# oversight.
volumes:
  shadow_audio:
