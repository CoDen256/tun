<script>
/* ===================================================================
   Fixed clock, so the mockup reads the same every time it is opened.
   =================================================================== */
const NOW = new Date("2026-11-20T16:42:00+01:00");

function timeAgo(d) {                       // server.js's own timeAgo()
  const ms = NOW - new Date(d);
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "h ago";
  const days = Math.floor(hours / 24);
  if (days === 1) return "yesterday";
  if (days < 7) return days + "d ago";
  return Math.floor(days / 7) + "w ago";
}
const nf = (n) => n.toLocaleString("en-US");
function bytes(n) {
  if (n == null) return "—";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KiB";
  return (n / 1048576).toFixed(2) + " MiB";
}
function iso(d) { return new Date(d).toISOString().replace(".000Z", "Z"); }
function clock(d) { return iso(d).slice(0, 16).replace("T", " ") + "Z"; }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ===================================================================
   RAIL — hub's real NAV, with one item added to the Device group.
   =================================================================== */

function sortEvents(list) {
  const key = PF.sort, sign = PF.dir === "desc" ? -1 : 1;
  return list.slice().sort((a, b) => {
    let x, y;
    if (key === "ts") { x = a.ts; y = b.ts; }
    else if (key === "kind") { x = a.kind; y = b.kind; }
    else if (key === "build") { x = a.build || ""; y = b.build || ""; }
    else if (key === "status") { x = a.status; y = b.status; }
    else if (key === "bytes") { x = a.bytes; y = b.bytes; }
    else { x = a.ip; y = b.ip; }
    if (x < y) return -1 * sign;
    if (x > y) return 1 * sign;

    'Everything older is one entry per backup commit of <code>userdata/' + UID + '.json</code> in <code>tun-backup</code>. ' +
    'The two tiers read from different places and <b>fail independently</b>.' +
    '</div>';
  return source + '<div class="timeline">' + recentTierHtml() + gitTierHtml() + '</div>' +
    '<div class="inline-note">Above the line: "raw doc" is that history row\'s full document (<code>historyDoc</code>), and "archived · &lt;sha&gt;" shows the same change as the daily tier recorded it. Below the line: "document" is the commit\'s full export and "diff" is <code>git diff</code> against the previous commit — all fetched on demand, never inlined into the page.</div>';
}

function syncPage() {
  return `
<div class="page-head">
  <div>
    <h2>Device sync</h2>
    <div class="page-sub">Progress reported by the signed-in account, kept as a mirror — this view is read-only.</div>
  </div>
  <button class="btn btn-ghost">↻ Refresh</button>
</div>

<div class="identity-bar">
  <div class="field">
    <label>Account (uid)</label>
    <select><option selected>${UID} — only account on record</option></select>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <div><h3>Progress snapshot</h3><div class="page-sub">From the device's current <code>userdata</code> document.</div></div>
  </div>
  <div class="panel-pad">
    <div class="snap-grid">
      <div class="snap-item"><div class="label">Completed sessions</div><div class="value">43</div></div>
      <div class="snap-item"><div class="label">Consistency rate</div><div class="value">—</div></div>
      <div class="snap-item"><div class="label">Cards in progress</div><div class="value">325</div></div>
      <div class="snap-item"><div class="label">Cards archived</div><div class="value">46</div></div>
      <div class="snap-item"><div class="label">Account since</div><div class="value">2026-06-14</div></div>
      <div class="snap-item"><div class="label">Last completed session</div><div class="value prose">2h ago</div></div>
    </div>
    <details class="json-toggle" style="margin-top:16px;"><summary>raw doc</summary><pre>{ "completedSessions": 43, "inProgressCards": 325, … }</pre></details>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <div><h3>Per-card progress</h3><div class="page-sub">Every occurrence with SRS state, joined against card content — 1 191 matching.</div></div>
  </div>
  <div class="panel-pad" style="padding-bottom:0;">
    <div class="toolbar">
      <input class="search-input" type="search" placeholder="Search card id or content…">
      <select><option>Deck: all</option><option>Lexic</option><option>Practice</option></select>
      <select><option>Side: all</option><option>N</option><option>E</option><option>A</option></select>
      <select><option>State: all</option><option>in rotation</option><option>retired at ceiling</option><option>parked early</option><option>parked early, dormant</option></select>
      <select><option>Flag: all</option><option>tagged</option><option>panic</option></select>
      <select><option>Sort: device order</option><option>Card id</option><option>Stage</option><option>Next due</option></select>
      <select><option>asc</option><option>desc</option></select>
      <select><option>50 / page</option></select>
      <button type="button">Filter</button>
      <button class="btn-ghost">Clear</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Card</th><th>Content</th><th>Side</th><th>Deck</th><th class="num">Stage</th><th>Status</th><th class="num">Interval</th><th>Next due</th><th class="num">Reschedules</th><th>Flags</th></tr></thead>
      <tbody>${PER_CARD.map(c => '<tr>' +
        '<td class="mono">' + c.id + '</td>' +
        '<td class="wrap" style="max-width:280px">' + esc(c.content) + '</td>' +
        '<td class="mono">' + c.side + '</td>' +
        '<td>' + c.deck + '</td>' +
        '<td class="num">' + c.stage + '</td>' +
        '<td><span class="pill pill-' + c.pill + '">' + c.state + '</span></td>' +
        '<td class="num">' + c.cf + 'd</td>' +
        '<td class="mono">' + c.due + '</td>' +
        '<td class="num">' + c.resch + '</td>' +
        '<td>' + c.flags + '</td></tr>').join("")}</tbody>
    </table>
  </div>
  <div class="panel-pad" style="padding-top:12px;padding-bottom:14px;">
    <div class="pager"><span class="pager-readout">1–6 of 1 191 · page 1 of 24</span>
      <button class="btn-ghost" disabled>« first</button><button class="btn-ghost" disabled>‹ prev</button>
      <button class="btn-ghost pager-current" disabled>1</button><button class="btn-ghost">next ›</button><button class="btn-ghost">last »</button></div>
    <div class="inline-note">"Content" is always the card's <strong>N</strong> field (stripped of HTML), the same for every row regardless of which side was reviewed. "Side" is the stored direction letter (N/E/A), never an actual language.</div>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <div style="min-width:0">
      <h3>Sync history</h3>
      <div class="page-sub">One chronological timeline at two fidelities — per-PATCH for 48 h, one entry per day before that.</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600">mockup state</span>
      <span class="seg">
        <button data-sfstate="ok" class="${SF.state === "ok" ? "on" : ""}">both tiers</button>
        <button data-sfstate="down" class="${SF.state === "down" ? "on" : ""}">backup unreachable</button>
        <button data-sfstate="empty" class="${SF.state === "empty" ? "on" : ""}">nothing archived</button>
        <button data-sfstate="norecent" class="${SF.state === "norecent" ? "on" : ""}">no recent syncs</button>
      </span>
    </div>
  </div>
  <div class="panel-pad">
    <div id="export-body">${exportPanelBody()}</div>
  </div>
</div>`;
}

/* ===================================================================
   harness wiring
   =================================================================== */
const SURFACES = {
  pulls: {
    active: "/mjolnir/device/pulls", render: pullsPage,
    cap: '<b>Surface 1 — NEW page</b> <code>/mjolnir/device/pulls</code>. <span class="mk-new">Added:</span> the whole page, plus one rail item under Device (Sync · <span class="mk-new">Pulls</span> · Insights). Source: gateway access log → hub\'s new <code>ota_pulls</code> table. The device contract is untouched.',
  },
  history: {
    active: "/mjolnir", render: historyPage,
    cap: '<b>Surface 2 — MODIFICATION</b> of <code>/mjolnir</code> (Publish history). Existing columns kept verbatim. <span class="mk-new">Added:</span> the <span class="mk-new">Pulls</span> and <span class="mk-new">Last pulled</span> columns, the never-pulled-while-current highlight + banner, and the "only never-pulled" filter. <code>/mjolnir/ota</code> is deliberately unchanged — see the last note on the page.',
  },
  sync: {
    active: "/mjolnir/device", render: syncPage,
    cap: '<b>Surface 3 — MODIFICATION</b> of <code>/mjolnir/device</code> (Sync). uid picker, progress snapshot, per-card progress and the raw-doc viewer are as today. <span class="mk-new">Rebuilt:</span> the "Sync history" panel is now <span class="mk-new">two tiers in one timeline</span> — per-PATCH from <code>userdata_history</code> (kept, swept to 48 h, data excluded from <code>mjolnir.sql</code>) above a labelled horizon, one entry per backup commit below it. The tiers degrade independently: try the four mockup states in the panel head.',
  },
};
let current = "pulls";

function render() {
  const s = SURFACES[current];
  document.getElementById("rail").innerHTML = renderRail(s.active);
  document.getElementById("content").innerHTML = s.render();
  document.getElementById("mk-cap").innerHTML = s.cap;
  document.querySelectorAll(".mk-bar [data-surface]").forEach(b => b.classList.toggle("on", b.dataset.surface === current));
  window.scrollTo({ top: 0 });
}

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-surface], [data-nav], [data-sort], [data-run], [data-page], [data-filter-build], [data-pulls-for], [data-exp], [data-sfstate], #pf-clear, #exp-retry, #theme-btn, #pulls-refresh");
  if (!t) return;

  if (t.id === "theme-btn") {
    const root = document.documentElement;
    const isLight = root.dataset.theme === "light" ||
      (!root.dataset.theme && window.matchMedia("(prefers-color-scheme: light)").matches);
    root.dataset.theme = isLight ? "dark" : "light";
    return;
  }
  if (t.dataset.surface) { current = t.dataset.surface; render(); ev.preventDefault(); return; }
  if (t.dataset.nav) {
    ev.preventDefault();
    const map = { "/mjolnir/device/pulls": "pulls", "/mjolnir": "history", "/mjolnir/device": "sync" };
    if (map[t.dataset.nav]) { current = map[t.dataset.nav]; render(); }
    return;
  }
  if (t.id === "pulls-refresh") { render(); return; }
  if (t.dataset.sort) {
    const k = t.dataset.sort;
    if (PF.sort === k) PF.dir = PF.dir === "desc" ? "asc" : "desc";
    else { PF.sort = k; PF.dir = k === "ts" ? "desc" : "asc"; }
    PF.page = 1; render(); return;
  }
  if (t.dataset.run) { PF.open[t.dataset.run] = !PF.open[t.dataset.run]; render(); return; }
  if (t.dataset.page) { PF.page = Number(t.dataset.page); render(); return; }
  if (t.dataset.filterBuild) { ev.preventDefault(); PF.build = t.dataset.filterBuild; PF.kind = "bundle"; PF.window = "all"; PF.page = 1; render(); return; }
  if (t.dataset.pullsFor) { ev.preventDefault(); PF.build = t.dataset.pullsFor; PF.kind = "all"; PF.window = "all"; PF.page = 1; current = "pulls"; render(); return; }
  if (t.id === "pf-clear") { Object.assign(PF, { kind: "all", build: "", window: "30d", ip: "", page: 1, open: {} }); render(); return; }
  if (t.dataset.exp) {
    const k = t.dataset.exp, mode = t.dataset.mode;
    SF.open[k] = SF.open[k] === mode ? null : mode;
    document.getElementById("export-body").innerHTML = exportPanelBody();
    return;
  }
  if (t.dataset.sfstate) { SF.state = t.dataset.sfstate; render(); return; }
  if (t.id === "exp-retry") { SF.state = "ok"; render(); return; }
});

document.addEventListener("change", (ev) => {
  const id = ev.target.id;
  if (id === "pf-kind") { PF.kind = ev.target.value; PF.page = 1; render(); }
  else if (id === "pf-build") { PF.build = ev.target.value; PF.page = 1; render(); }
  else if (id === "pf-window") { PF.window = ev.target.value; PF.page = 1; render(); }
  else if (id === "pf-size") { PF.size = Number(ev.target.value); PF.page = 1; render(); }
  else if (id === "pf-collapse") { PF.collapse = ev.target.checked; PF.page = 1; render(); }
  else if (id === "hf-never") { HF.onlyNever = ev.target.checked; render(); }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "pf-ip") {
    PF.ip = ev.target.value; PF.page = 1;
    const v = ev.target.value, pos = ev.target.selectionStart;
    render();
    const el = document.getElementById("pf-ip");
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
});

render();
</script>
