  <circle cx="32" cy="32" r="32" fill="url(#stabbur-g)"/>
  <rect x="19" y="13" width="26" height="38" rx="5" fill="#fff" opacity="0.42" transform="rotate(10 32 32)"/>
  <g transform="rotate(-6 32 32)">
    <rect x="19" y="13" width="26" height="38" rx="5" fill="#fff"/>
    <g fill="#D8342A">
