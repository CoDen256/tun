# D118: service names made unique (smia-postgres/smia-backend, not
# postgres/backend) so the root compose.yaml's `include:` can merge this file
# alongside mjolnir's, stabbur's and phonexa's without a service-name
# collision — Compose's `include:` silently keeps only the FIRST included
# file's definition of a colliding service name, dropping every subsequent
# one with no error (same class of bug D94 already fixed once for stabbur's
# own postgres service) — this isn't cosmetic, it would mean smia simply
# never starts under `include:`, with no visible error.
#
# One repository is one Compose project with one default network, so the old
# `tun-shared` external network (D98/D104) and its one-time
# `docker network create` step are gone: stabbur's backend, phonexa's backend
# and mjolnir's Caddy all reach `smia-backend` by service name on the default
# network, with no network configuration at all.
#
# Shared values (SMIA_POSTGRES_PASSWORD, SMIA_AUTH_TOKEN) are interpolated from the
# ROOT .env — the one Compose reads for the project you invoke it in. Running
# this file standalone from smia/ therefore needs them passed in:
#   docker compose --env-file ../.env -f compose.yaml up
# smia's own secrets (HF/DeepL/ElevenLabs) come from smia/.env via `env_file:`
# below, which resolves relative to THIS file in both modes.
#
# No host ports are published here: dev-only loopback publishing lives in
# compose.override.yaml, which Compose auto-loads for `cd smia && docker
# compose up` and ignores under the root stack. See that file for why it is a
# file and not `profiles:`.
services:
  smia-postgres:
    # Stays on postgres:16 deliberately. The 16 -> 17 upgrade is
    # postgres-consolidation's job and needs a dump/restore: bumping the image
    # here would leave the server refusing to start against the existing PG16
    # data directory in smia_smia-pg-data.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smia
      POSTGRES_PASSWORD: ${SMIA_POSTGRES_PASSWORD:-smia}
      POSTGRES_DB: smia
    volumes:
      - smia-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smia"]
      interval: 2s
      timeout: 3s
      retries: 20

  smia-backend:
    build:
      # Context is the repository root so a later change can COPY from
      # libs/; paths inside an included file resolve relative to the file,
      # so `..` is the repo root in both standalone and unified mode. The
      # root .dockerignore is what keeps that context small.
      context: ..
      dockerfile: smia/Dockerfile
    restart: unless-stopped
    depends_on:
      smia-postgres:
        condition: service_healthy
    env_file:
      # smia-only provider credentials (D-T2): HF_TOKEN, DEEPL_TOKEN,
      # ELEVENLABS_TOKEN. Passed through, never required — a provider whose
      # token is empty just fails at adapter-call time with its existing
      # "needs a *_TOKEN" error; compose never refuses to start over a
      # missing provider key. See .env.example.
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://smia:${SMIA_POSTGRES_PASSWORD:-smia}@smia-postgres:5432/smia
      SMIA_AUTH_TOKEN: ${SMIA_AUTH_TOKEN}
      FLASK_DEBUG: "0"
    volumes:
      # Bind mount, not baked into the image: providers/ is raw lookup data
      # (hundreds of MB) that would otherwise sit in every built image layer.
      # It IS tracked in git (operator decision, 2026-11-13), so a fresh
      # clone has it and bootstrap.py can import from here once, idempotently
      # (skipped on restart once the named Postgres volume is populated),
      # warning-but-not-failing for any file that is absent — the two Leipzig
      # archives and the nbno zip are the only gitignored exceptions.
      - ./providers:/app/providers:ro

volumes:
  # Explicit `name:` so this is the SAME Docker volume whether brought up via
  # `cd smia && docker compose up` or through the root compose.yaml's
  # `include:` — without it, Compose prefixes the volume name with whatever
  # project is running, creating two entirely separate volumes and making
  # every imported provider dataset "disappear" switching entry points
  # (identical cause to stabbur's own D98 volume-naming fix).
  smia-pg-data:
    name: smia_smia-pg-data
