# tun — the unification point (D94, extended by D118 to include smia and by
# D147 to include phonexa). Brings up mjolnir's, stabbur's, smia's and
# phonexa's own stacks together from one `docker compose up`, without
# changing any of the four repos' own compose files: `include:` merges all
# four projects onto one shared network, so e.g. mjolnir's Caddy can reach
# stabbur's `backend`, smia's `smia-backend` and phonexa's
# `phonexa-backend` services by name with no extra wiring. Each included
# file stays fully usable standalone too (`cd mjolnir && docker compose up`
# is unaffected by this file existing).
#
# Assumes sibling checkout: tun, mjolnir, stabbur, smia, phonexa cloned at
# the same filesystem level (see DEPLOY.md). Requires Compose v2.20+ for
# `include:`. phonexa needs no extra data on the host (nothing like smia's
# `providers/` below) — just the checkout and its own `.env`.
# smia additionally needs its own `providers/` directory populated on
# whatever host actually runs it — gitignored, ~1GB, not fetched by this
# file or by cloning the repo; without it, every data-backed provider
# (ordbank, nst, kaikki, wikipron, dict.cc static) returns empty candidates
# for every lookup, indistinguishable from a code bug unless you know to
# check for this (confirmed live, D118).
#
# `STABBUR_UPSTREAM`/`STABBUR_BASE_URL` can both simply be "backend:5056",
# and `SMIA_UPSTREAM`/`SMIA_BASE_URL` both "smia-backend:5055", under this
# deployment mode — same values as the `tun-shared` external-network mode
# (D98), different mechanism: here the shared network comes from `include:`
# merging the three projects, not a separately-created external network.
# Either mode is fine; this file is for operators who want the "one command"
# version rather than three independent `docker compose up`s.
include:
  - ../mjolnir/compose.yaml
  - ../stabbur/compose.yaml
  - ../smia/compose.yml
  # phonexa prefixes every one of its service and volume names `phonexa-`
  # precisely so it can be merged here (D94/D118: `include:` flattens
  # everything into one namespace and silently keeps only the FIRST
  # definition of a colliding name — phonexa's old generic `postgres`,
  # `backend`, `adminer` would have collided with mjolnir's and stabbur's
  # and simply never started). Its own development Adminer is behind a
  # `dev` profile, so it does not start here; use the shared one below.
  - ../phonexa/docker-compose.yml

# Both included files declare `tun-shared` as `external: true` (D98, so
# mjolnir and stabbur can also be deployed as two fully independent stacks
# that still reach each other by name). `include:` merges that declaration
# in verbatim — an including file's own `networks:` block CANNOT clear
# `external: true` back off (tried and confirmed false, 2026-10-26: Compose
# still reports "network tun-shared declared as external, but could not be
# found" even with an overriding `tun-shared: {}` here, unless a real
# network by that name already happens to exist on the host for an
# unrelated reason — which is what silently papered over this the first
# time it was "verified"). So: this mode needs the exact same one-time setup
# as the two-stack mode, not less —
#
#     docker network create tun-shared
#
# — once, before the first `docker compose up` here. DEPLOY.md's first-boot
# steps include this; do not skip it because this file's docstring used to
# imply you could.
services:
  # One database-exploration tool for every included service's Postgres
  # (D-T3) — not one Adminer per database. `stabbur`'s own compose.yaml
  # already defines a service literally named "adminer" (scoped to just its
  # own Postgres); reusing that exact key here means Compose deep-merges
  # this definition on top of the included one rather than running a
  # second, separate container — the override, not an addition. Point its
  # login screen at "mjolnir-postgres" (mjolnir's hub DB), "stabbur-postgres"
  # (stabbur's DB) or "phonexa-postgres" (phonexa's DB) by name; all resolve
  # once brought up together. phonexa's own Adminer stays off (its `dev`
  # compose profile), so this really is the single one.
  adminer:
    image: adminer
    container_name: tun-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mjolnir-postgres
    ports:
      - "8082:8080"

  # compose-backup-service: supersedes git-backup's host script + crontab
  # entry (D-C1..D-C5) — a real service, `docker compose up` and nothing
  # else. Connects to all three Postgres instances over the network with a
  # real password (D-C1), not `docker exec` — no Docker socket mounted at
  # all.
  # `stabbur-blobs` is referenced directly even though it's declared (with
  # an explicit `name:`) in stabbur's own included compose.yaml, not this
  # file — confirmed live that `include:` makes this work with zero extra
  # declaration (D-C2), the same way `mjolnir-postgres`/`stabbur-postgres`
  # are already reachable by name above. Depends on `postgres-17-upgrade`
  # (stabbur) having landed — this image installs exactly one
  # `postgresql-client` version (see `backup/Dockerfile`).

  # docker compose run --rm -e RUN_ONCE=1 backup
  backup:
    build: ./backup
    container_name: tun-backup
    restart: unless-stopped
    # Found live: on a fresh `docker compose up` (e.g. right after
    # postgres-17-upgrade's new volume), a Postgres container goes through
    # its own two-phase init-then-restart startup — reachable on the
    # network but refusing connections for a few seconds. Without this,
    # the backup service's first run can race it and dump nothing for
    # whichever database wasn't ready yet. entrypoint.sh's atomic
    # dump-then-rename already stops a failed dump from corrupting the
    # backup repo, but waiting for all three to be genuinely healthy avoids the
    # failure (and the resulting day-long wait for the next scheduled
    # attempt) in the first place.
    depends_on:
      mjolnir-postgres:
        condition: service_healthy
      stabbur-postgres:
        condition: service_healthy
      phonexa-postgres:
        condition: service_healthy
    # mjolnir's own .env already has the real POSTGRES_PASSWORD it uses —
    # reused as-is, not duplicated into tun's own .env.
    env_file:
      - ../mjolnir/.env
    environment:
      BACKUP_REPO_URL: ${BACKUP_REPO_URL:?set BACKUP_REPO_URL in tun/.env}
      # stabbur's own compose.yaml hardcodes POSTGRES_PASSWORD: stabbur
      # directly rather than reading it from an env file (a pre-existing
      # fact about that repo, not introduced here) — set explicitly here
      # to match it, documented in .env.example so the two don't silently
      # drift if stabbur's compose file ever changes that value.
      STABBUR_POSTGRES_PASSWORD: ${STABBUR_POSTGRES_PASSWORD:-stabbur}
      # Same drift hazard as STABBUR_POSTGRES_PASSWORD above, one step
      # removed: phonexa's own compose reads this from phonexa's `.env`
      # (`${PHONEXA_POSTGRES_PASSWORD:-phonexa}`), not from tun's, so the
      # value must be set to the same thing in BOTH `.env` files. Nothing
      # keeps them in sync; if they drift the phonexa dump fails, and
      # because all three dumps are one all-or-nothing transaction that
      # aborts the whole run loudly rather than silently skipping phonexa.
      PHONEXA_POSTGRES_PASSWORD: ${PHONEXA_POSTGRES_PASSWORD:-phonexa}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      # The repo clone persists here across restarts (D-C4) — cloned by
      # the container itself on first boot, never a host bind-mount.
      - backup-repo-clone:/data
      - stabbur-blobs:/stabbur-blobs:ro
      # phonexa's audio, same zero-extra-declaration trick as
      # stabbur-blobs above (D-C2): the key is declared in phonexa's own
      # included docker-compose.yml and resolves here through `include:`.
      # Read-only — the backup service only ever copies out of it. Unlike
      # stabbur's flat, write-once blob store this is a NESTED tree
      # (lang/<lang>/ingested/<name>.wav) whose files can be rewritten in
      # place by Formant Lab's sample trim, which is why entrypoint.sh's
      # copy loop is recursive and why its copy-if-absent rule has a
      # documented staleness consequence (D147).
      - phonexa-audio-data:/phonexa-audio:ro
      # Exactly one mounted private key file (D-C3) — not the operator's
      # whole ~/.ssh directory, not a fresh deploy key. known_hosts is
      # managed automatically inside the named volume (StrictHostKeyChecking
      # =accept-new on first connect, entrypoint.sh), so nothing else needs
      # mounting for git push to work.
      - ${BACKUP_SSH_KEY_PATH:?set BACKUP_SSH_KEY_PATH in tun/.env}:/root/.ssh/id_backup:ro

volumes:
  backup-repo-clone:
    name: tun_backup-repo-clone
