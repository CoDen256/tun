# Tun — one stack, one VPS.
#
# P1 ships ONLY caddy: every device-facing path is a static file (D55).
# The other services are declared here as they are written; until then they
# sit behind compose profiles so `docker compose up -d` brings up exactly
# what exists.
#
#   docker compose up -d                 # P1: caddy alone
#   docker compose --profile db up -d    # P4 onward: + postgres
#
services:
  caddy:
    image: caddy:2-alpine
    container_name: tun-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      # Site address: a hostname in production (auto-HTTPS), ":8080" locally.
      TUN_SITE_ADDRESS: ${TUN_SITE_ADDRESS:?set TUN_SITE_ADDRESS in .env}
      OTA_TOKEN: ${OTA_TOKEN:?set OTA_TOKEN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/srv:ro                   # served read-only; publishing writes from the host
      - caddy_data:/data                 # TLS certs — LOSING THIS MEANS RE-ISSUING CERTS
      - caddy_config:/config

  postgres:
    image: postgres:17-alpine
    container_name: tun-postgres
    profiles: ["db"]                     # not started until P4 needs it
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: tun
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately NOT published to the host: only sibling containers reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tun"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Added as each is written (D42). Separate logical DB per service, no
  # cross-service FKs. Order of arrival: hub+builder (P4/P5), smia (P6),
  # stabbur (P4), phonexa (existing, migrated later).
  #
  # mjolnir-hub:      device-facing /mjolnir/userdata + heartbeat   (P5)
  # mjolnir-builder:  worker, polls build_jobs                      (P4)
  # stabbur:          captures, items, triage UI                    (P4)
  # smia:             inflect / ipa / tts / stt / translate          (P6)
  # phonexa:          existing phonetics lab                        (later)

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
