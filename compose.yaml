# tun — the unification point (D94). Brings up mjolnir's and stabbur's own
# stacks together from one `docker compose up`, without changing either
# repo's own compose file: `include:` merges both projects onto one shared
# network, so e.g. mjolnir's Caddy can reach stabbur's `backend` service by
# name with no extra wiring. Each included file stays fully usable standalone
# too (`cd mjolnir && docker compose up` is unaffected by this file existing).
#
# Assumes sibling checkout: tun, mjolnir, stabbur cloned at the same
# filesystem level (see DEPLOY.md). Requires Compose v2.20+ for `include:`.
#
# `STABBUR_UPSTREAM`/`STABBUR_BASE_URL` can both simply be "backend:5056"
# under this deployment mode — same value as the `tun-shared` external-
# network mode (D98), different mechanism: here the shared network comes
# from `include:` merging the two projects, not a separately-created
# external network. Either mode is fine; this file is for operators who
# want the "one command" version rather than two independent `docker
# compose up`s.
include:
  - ../mjolnir/compose.yaml
  - ../stabbur/compose.yaml

# Both included files declare `tun-shared` as `external: true` (D98, so
# mjolnir and stabbur can also be deployed as two fully independent stacks
# that still reach each other by name). `include:` merges that declaration
# in verbatim — an including file's own `networks:` block CANNOT clear
# `external: true` back off (tried and confirmed false, 2026-10-26: Compose
# still reports "network tun-shared declared as external, but could not be
# found" even with an overriding `tun-shared: {}` here, unless a real
# network by that name already happens to exist on the host for an
# unrelated reason — which is what silently papered over this the first
# time it was "verified"). So: this mode needs the exact same one-time setup
# as the two-stack mode, not less —
#
#     docker network create tun-shared
#
# — once, before the first `docker compose up` here. DEPLOY.md's first-boot
# steps include this; do not skip it because this file's docstring used to
# imply you could.
services:
  # One database-exploration tool for every included service's Postgres
  # (D-T3) — not one Adminer per database. `stabbur`'s own compose.yaml
  # already defines a service literally named "adminer" (scoped to just its
  # own Postgres); reusing that exact key here means Compose deep-merges
  # this definition on top of the included one rather than running a
  # second, separate container — the override, not an addition. Point its
  # login screen at "postgres" (mjolnir's hub DB) or "stabbur-postgres"
  # (stabbur's DB) by name; both resolve once brought up together.
  adminer:
    image: adminer
    container_name: tun-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"
