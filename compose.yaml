# tun — the whole ecosystem, one Compose project (D150).
#
# `include:` pulls in each project's OWN compose file, unchanged and still
# usable standalone (`cd stabbur && docker compose up`). What the monorepo
# removed is the `tun-shared` external network: one repository is one Compose
# project is one default network, so every service resolves every other by
# name with no configuration and no setup step. D94/D98/D101/D104's
# sibling-checkout apparatus — and the `docker network create tun-shared`
# that D94 claimed was unnecessary, D98 required and D104 corrected — are all
# gone with it.
#
# There are no prerequisites. Clone, create `.env`, `docker compose up`.
#
#   docker compose up                    # everything
#   docker compose up stabbur-backend    # one service + its database
#   cd stabbur && docker compose up      # the same, plus loopback ports for a
#                                        # native venv (compose.override.yaml)
#
# Host ports: in the unified stack the gateway is the only service publishing
# on a PUBLIC interface. This file's `adminer` also publishes, on loopback
# only (127.0.0.1:8082), because it is an operator tool that has to be
# reachable here; phonexa's own dev Adminer does the same behind a `dev`
# profile. Every SERVICE port lives in that project's own
# `compose.override.yaml`, which Compose auto-loads ONLY for the primary
# compose file of the directory it runs in — verified — so `docker compose up`
# here publishes no service ports at all.
include:
  - ./mjolnir/compose.yaml
  - ./stabbur/compose.yaml
  - ./smia/compose.yaml
  # phonexa prefixes every service and volume name `phonexa-` precisely so it
  # can be merged here: `include:` flattens everything into one namespace and
  # silently keeps only the FIRST definition of a colliding name (D94/D118).
  # Its own development Adminer is behind a `dev` profile, so it does not
  # start here; use the shared one below.
  - ./phonexa/compose.yaml

services:
  # One database-exploration tool for the one cluster (D-T3, D155). Log in as
  # a service role (`stabbur` / `smia` / `mjolnir` / `phonexa` / `shadow`) with
  # that role's derived password, "<POSTGRES_PASSWORD>_<db>" — each role sees
  # only its own database, which is the same isolation the services get.
  #
  # (The comment here used to say this key deep-merges over an `adminer`
  # service of stabbur's own. That stopped being true when stabbur renamed its
  # services to `stabbur-*` under D94: stabbur defines no `adminer`, so this
  # is simply the only one.)
  adminer:
    image: adminer
    restart: unless-stopped
    environment:
      # One cluster now (D155) — this is the only server there is, and all
      # five databases are reachable from it with each service's own role.
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8082:8080"

  # compose-backup-service (D-C1..D-C5): a real service, not a host script
  # plus crontab. Connects to each Postgres over the network with a real
  # password (D-C1) — no Docker socket is mounted at all.
  #
  # Run one cycle by hand:
  #   docker compose run --rm -e RUN_ONCE=1 backup
  #
  # `stabbur-blobs` and `phonexa-audio-data` are referenced directly even
  # though they are declared in those projects' own compose files — `include:`
  # makes that work with no extra declaration here (D-C2).
  #
  # Covers ALL FIVE databases — mjolnir, stabbur, smia, phonexa, shadow.
  # smia joined the set with D155: it had never been backed up at all, while
  # being the only database carrying 2.7M rows of imported corpora.
  backup:
    build: ./backup
    restart: unless-stopped
    # A Postgres container goes through its own init-then-restart startup:
    # reachable on the network but refusing connections for a few seconds.
    # Without waiting for health, the first run can race it and dump nothing.
    # entrypoint.sh's atomic dump-then-rename already stops a failed dump from
    # corrupting the backup repo; this avoids the failure in the first place.
    depends_on:
      # One cluster now (D155), and the BOOTSTRAP rather than the bare server:
      # dumping before the databases exist would produce five empty files.
      postgres-init:
        condition: service_completed_successfully
    environment:
      BACKUP_REPO_URL: ${BACKUP_REPO_URL:?set BACKUP_REPO_URL in the root .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # ONE password now (D155). The four per-database keys this file used to
      # carry existed because Postgres applies a password only when it
      # initialises a fresh data directory, so three live volumes still held
      # the literals they were created with. Restoring into a fresh cluster is
      # exactly the moment that constraint lifts — entrypoint.sh derives each
      # role password as "<POSTGRES_PASSWORD>_<db>", the same rule
      # postgres/init/bootstrap.sh used to create them.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
    volumes:
      # The repo clone persists across restarts (D-C4) — cloned by the
      # container on first boot, never a host bind mount.
      - backup-repo-clone:/data
      - stabbur-blobs:/stabbur-blobs:ro
      # phonexa's audio is a NESTED tree (lang/<lang>/ingested/<name>.wav)
      # whose files can be rewritten in place by Formant Lab's sample trim,
      # which is why entrypoint.sh's copy loop is recursive and why its
      # copy-if-absent rule has a documented staleness consequence (D147).
      - phonexa-audio-data:/phonexa-audio:ro
      # Exactly one mounted private key file (D-C3) — not the operator's whole
      # ~/.ssh. known_hosts is managed inside the named volume
      # (StrictHostKeyChecking=accept-new on first connect).
      - ${BACKUP_SSH_KEY_PATH:?set BACKUP_SSH_KEY_PATH in the root .env}:/root/.ssh/id_backup:ro

volumes:
  backup-repo-clone:
    name: tun_backup-repo-clone
