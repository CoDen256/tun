<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>stabbur</title>
  <link rel="icon" type="image/svg+xml" href="__STABBUR_PREFIX__/icon.svg">
  <script>
    // Appearance before first paint (stabbur-editor-redesign D12). The server
    // substitutes the stored theme + value colour into the JSON.parse below
    // (app.py); when it could not read them (database down, D157) the copy
    // this browser cached on its last visit is used instead, then the
    // defaults. ui.js re-confirms against GET /api/settings after load.
    // The layout class is set here too, so the first frame already has the
    // right one of the two layouts.
    (function () {
      var d = document.documentElement, look = null;
      try { look = JSON.parse('__STABBUR_LOOK__'); } catch (e) { look = null; }
      if (!look) { try { look = JSON.parse(localStorage.getItem('stabbur_look')); } catch (e) { look = null; } }
      if (!look) look = { theme: 'auto', value_color: 'blue', value_color_custom: null };
      try { localStorage.setItem('stabbur_look', JSON.stringify(look)); } catch (e) { /* private mode */ }
      if (look.theme === 'light' || look.theme === 'dark') d.setAttribute('data-theme', look.theme);
      d.setAttribute('data-val', look.value_color || 'blue');
      if (look.value_color === 'custom' && look.value_color_custom) d.style.setProperty('--val', look.value_color_custom);
      d.classList.add(window.matchMedia('(min-width: 960px)').matches ? 'vp-desktop' : 'vp-phone');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="__STABBUR_PREFIX__/static/ui.css">
</head>
<body>
  <div class="device" id="app"></div>
  <input type="file" id="fileIn" accept="audio/*" hidden>
  <script>window.STABBUR_PREFIX = "__STABBUR_PREFIX__";</script>
  <script src="__STABBUR_PREFIX__/static/ui.js"></script>
</body>
</html>
