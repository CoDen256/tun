<title>Stabbur Editor Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one editor, three contexts. Phone = header + segmented tabs + pinned verdict bar.
   Desktop = headword band, three quiet zones (Word | Sound | Meaning), grammar as one line. */
:root{
  --bg:#fbfbfc; --surface:#ffffff; --sunk:#f2f3f5; --ink:#101318; --ink-2:#3a3f47; --mute:#6c727d; --faint:#a3a8b0;
  --line:#e6e8ec; --line-2:#d4d7dd; --accent:#2747d0; --accent-ink:#ffffff; --accent-soft:#e9edfb; --val:#1f3a8f;
  --ok:#1d7f55; --warn:#a66a12; --danger:#bf3434; --danger-soft:#fbecec; --wave:#cdd1d8;
  --chrome:#eceef1; --scrim:rgba(16,19,24,.28); --shadow:0 18px 50px rgba(16,19,24,.16);
  --f-hw:"Schibsted Grotesk","Inter",system-ui,sans-serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Charis SIL","Noto Sans","Doulos SIL","Gentium Plus","Lucida Grande","Segoe UI",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1013; --surface:#14171b; --sunk:#1b1e23; --ink:#eceef1; --ink-2:#c2c6cd; --mute:#8f95a0; --faint:#5b616a;
  --line:#24282e; --line-2:#333841; --accent:#8aa2ff; --accent-ink:#0a0e1c; --accent-soft:#1b2342; --val:#b9c8ff;
  --ok:#4cc38a; --warn:#e0a84a; --danger:#f07a7a; --danger-soft:#3a1b1d; --wave:#3a3f47;
  --chrome:#08090b; --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#14171b; --sunk:#1b1e23; --ink:#eceef1; --ink-2:#c2c6cd; --mute:#8f95a0; --faint:#5b616a;
  --line:#24282e; --line-2:#333841; --accent:#8aa2ff; --accent-ink:#0a0e1c; --accent-soft:#1b2342; --val:#b9c8ff;
  --ok:#4cc38a; --warn:#e0a84a; --danger:#f07a7a; --danger-soft:#3a1b1d; --wave:#3a3f47;
  --chrome:#08090b; --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}

/* value colour candidates (mockup switch) */
:root[data-val="blue"]{--val:#0b5cff} :root[data-val="teal"]{--val:#00897b} :root[data-val="violet"]{--val:#7c3aed} :root[data-val="orange"]{--val:#d9480f}
@media (prefers-color-scheme: dark){
 :root[data-val="blue"]:not([data-theme="light"]){--val:#82adff} :root[data-val="teal"]:not([data-theme="light"]){--val:#4fd1c0}
 :root[data-val="violet"]:not([data-theme="light"]){--val:#b79cff} :root[data-val="orange"]:not([data-theme="light"]){--val:#ff9b5e}}
:root[data-theme="dark"][data-val="blue"]{--val:#82adff} :root[data-theme="dark"][data-val="teal"]{--val:#4fd1c0}
:root[data-theme="dark"][data-val="violet"]{--val:#b79cff} :root[data-theme="dark"][data-val="orange"]{--val:#ff9b5e}
.rhtml{font-size:15px;line-height:1.6;color:var(--ink);max-width:68ch}
.rhtml p{margin:0 0 10px}.rhtml ul{margin:0 0 10px;padding-left:20px}.rhtml em{font-style:normal;font-weight:600;color:var(--val)}
.rhtml table{border-collapse:collapse;margin:6px 0 12px;font-size:14px}.rhtml th,.rhtml td{border-bottom:1px solid var(--line);padding:5px 14px 5px 0;text-align:left}.rhtml th{font-weight:600;color:var(--mute);font-size:12px}
.htmlsrc{font:13px/1.5 var(--f-mono)!important}
.swr{display:flex;gap:10px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line-2);position:relative;cursor:pointer;flex:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swc{background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}
.swc[aria-pressed="true"]{background:var(--c)}
.swc input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--chrome);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:13px;height:13px}

/* ---------- mockup chrome (outside the app) ---------- */
.mock{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--chrome);border-bottom:1px solid var(--line-2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--chrome)}
.mock .tag{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mseg{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface)}
.mseg button{padding:5px 10px;color:var(--ink-2);white-space:nowrap}
.mseg button+button{border-left:1px solid var(--line-2)}
.mseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mpages{overflow-x:auto;max-width:100%;scrollbar-width:none}
.mock .sp{flex:1}
.stage{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;justify-content:center}
.vp-desktop .stage{padding:0}

/* ---------- device ---------- */
.device{position:relative;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.vp-phone .device{width:min(390px,100%);height:min(844px,calc(100dvh - var(--mockh,52px) - 32px));min-height:560px;border:1px solid var(--line-2);border-radius:26px;box-shadow:var(--shadow)}
.vp-desktop .device{width:100%;height:calc(100dvh - var(--mockh,52px));min-height:560px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.wrap{padding:0 20px}
.vp-desktop .wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,min(48px,4vw))}

/* app top line */
.top{display:flex;align-items:center;gap:14px;height:48px;border-bottom:1px solid var(--line)}
.wm{font:700 15px var(--f-hw);letter-spacing:-.01em}
.wm i{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav button{padding:6px 6px;border-radius:6px;color:var(--mute);font-size:13.5px;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink);font-weight:500}
.nav button:hover{color:var(--ink)}
.vp-desktop .top{height:56px}

/* ---------- editor head ---------- */
.belt{display:flex;align-items:center;gap:12px;padding-top:14px}
.qbtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;padding:4px 0;min-width:0;white-space:nowrap}
.qbtn svg.i{color:var(--mute)}
.pos{margin-left:auto;font:500 12.5px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos b{color:var(--ink);font-weight:500}
.track{height:2px;background:var(--line);margin-top:8px;position:relative}
.track span{position:absolute;inset:0 auto 0 0;background:var(--ink-2)}
.eh{padding-top:16px}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);min-height:28px;flex-wrap:wrap}
.meta .dot,.dotsep{width:3px;height:3px;border-radius:50%;background:var(--faint);display:inline-block}
.st{display:inline-flex;align-items:center;gap:5px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint)}
.st.ready{color:var(--ok)}.st.ready::before{background:var(--ok);border-color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.chip:hover{border-color:var(--ink-2)}
.meta .chip{margin-left:auto}
.tpill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 11px;border-radius:999px;background:var(--ink);color:var(--bg);font:500 12.5px var(--f-ui);white-space:nowrap;flex:none}
.tpill svg.i{width:12px;height:12px}
.hwrow{display:flex;align-items:center;gap:6px;min-width:0}
.hw{flex:1;min-width:0;border:0;background:transparent;resize:none;overflow:hidden;color:var(--ink);font:600 32px/1.1 var(--f-hw);letter-spacing:-.025em;padding:4px 0 6px;outline:none;border-bottom:1px solid transparent}
.hw:focus{border-bottom-color:var(--accent)}
.hw::placeholder{color:var(--faint)}
.vp-desktop .hw{font-size:60px;letter-spacing:-.03em}
@supports (field-sizing:content){.hwrow .hw{field-sizing:content;flex:0 1 auto;width:auto;min-width:4ch}}
.hwrow .grow{flex:1}
.bari .pfb{height:44px;border-radius:10px;padding:0 14px}
.vp-phone .bari .pfb{padding:0;width:44px;justify-content:center}
.vp-phone .bari .pfb svg.i{width:20px;height:20px}
.vp-phone .bari .ib{min-width:40px;padding:0 6px}
.vp-phone .bari .pri{font-size:14px;padding:0 12px}
.pfb{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);font-size:13.5px;font-weight:500;color:var(--ink);background:var(--surface);flex:none;white-space:nowrap}
.pfb svg.i{color:var(--accent);width:16px;height:16px}
.pfb:hover{border-color:var(--accent)}
.pfb.spin svg.i{animation:rot .8s linear infinite}
.vp-desktop .hwrow .tpill{align-self:flex-end;margin:0 0 16px 10px}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);margin-top:12px;padding:0 6px!important}
.tabs button{display:flex;align-items:center;justify-content:center;gap:5px;height:44px;color:var(--mute);font-size:13.5px;white-space:nowrap;font-weight:500;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:2px;background:var(--ink)}
.tabs button.opt{color:var(--faint);font-weight:400}
.tabs button.opt[aria-selected="true"]{color:var(--ink-2)}
.mk{display:inline-flex;align-items:center;gap:3px;font:500 10px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.mk::before{content:"";width:6px;height:6px;border-radius:50%;border:1.4px solid var(--faint)}
.mk.full::before{background:var(--ok);border-color:var(--ok)}
.mk.opt::before{border-style:dashed}
.pane{padding:22px 0 28px;display:flex;flex-direction:column;gap:26px}

/* fields: labels are small uppercase tracked, values are 16px ink */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl{display:flex;align-items:center;gap:7px;min-height:28px}
.fl label,.fl .lb{font:600 10.5px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fl .grow{flex:1}
.prov{font:400 10.5px var(--f-mono);color:var(--mute);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;line-height:15px}
.opt-tag{font:400 10.5px var(--f-mono);color:var(--faint)}
.sg{position:relative;width:30px;height:28px;display:inline-grid;place-items:center;color:var(--mute);border-radius:6px;flex:none}
.sg:hover{color:var(--accent);background:var(--accent-soft)}
.sg b{position:absolute;top:0;right:-2px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:500 9.5px/15px var(--f-mono);padding:0 3px;text-align:center}
.in{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0 7px;font-size:16px;color:var(--val);outline:none;border-radius:0}
.selbtn span{color:var(--val)}
.selbtn.none span{color:var(--faint)}
.lang{color:var(--val)!important}
.in:focus{border-bottom-color:var(--accent)}
.in::placeholder{color:var(--faint)}
.in.ipa{font:19px var(--f-ipa)}
textarea.in{resize:none;line-height:1.45;overflow:hidden;min-height:34px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px}
.ch{font-size:13.5px;border:1px solid var(--line-2);border-radius:999px;padding:3px 11px;color:var(--ink-2);white-space:nowrap}
.ch:hover{border-color:var(--ink-2)}
.ch[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch.dash{border-style:dashed;color:var(--mute)}
.custin{width:140px;border:0;border-bottom:1px solid var(--accent);background:transparent;font-size:13.5px;padding:3px 2px;outline:none}
.para{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.para .f{gap:0}
.para .k{font-size:11px;color:var(--faint);letter-spacing:.02em}
.para .in{font-size:15px}
.nopara{font-size:13.5px;color:var(--faint);padding:4px 0}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line)}
.row .in{border-bottom:0}
.row:focus-within{border-bottom-color:var(--accent)}
.lang{flex:none;margin-top:8px;height:22px;min-width:30px;padding:0 6px;border:1px solid var(--line-2);border-radius:5px;font:500 11px var(--f-mono);color:var(--ink-2);text-transform:uppercase}
.lang:hover{border-color:var(--ink-2)}
.x{width:28px;height:34px;display:grid;place-items:center;color:var(--faint);flex:none}
.x:hover{color:var(--danger)}
.x svg.i{width:15px;height:15px}
.add{align-self:flex-start;font-size:13.5px;color:var(--accent);padding:8px 0 0}
.ex .in{font-size:15.5px}
.empty{font-size:13.5px;color:var(--faint);padding:8px 0;border-bottom:1px dashed var(--line-2)}
.selbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border-bottom:1px solid var(--line);padding:6px 0 7px;font-size:16px}
.selbtn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbtn.none span{color:var(--faint)}
.selbtn svg.i{color:var(--mute);width:14px;height:14px}
.selbtn:hover{border-bottom-color:var(--ink-2)}

/* audio */
.player{display:flex;align-items:center;gap:12px;padding:8px 0 4px}
.play{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.play:hover{border-color:var(--ink)}
.play svg.i{width:16px;height:16px;fill:currentColor;stroke:none}
.wv{flex:1;min-width:0;height:56px;touch-action:none;cursor:ew-resize}
.wv svg{width:100%;height:56px;display:block}
.arange{display:flex;gap:10px;font:12px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums;padding-left:54px;flex-wrap:wrap}
.aacts{display:flex;gap:4px 16px;flex-wrap:wrap;padding-top:10px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);padding:4px 0}
.lnk:hover{color:var(--accent)}
.lnk svg.i{width:15px;height:15px}
.cap{font:11px var(--f-mono);color:var(--faint)}
.noaudio{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line-2);color:var(--faint);font-size:13.5px}

.rule{font-size:14px;color:var(--ink-2);line-height:1.55;padding-top:6px;max-width:60ch}
.rule em{font-style:normal;color:var(--ink);font-weight:500}

/* desktop editor */
.dmeta{display:flex;align-items:center;gap:16px;padding-top:26px;flex-wrap:wrap}
.dmeta .meta{flex:1}
.simline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.simline button.nm{color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.simline button.nm:hover{color:var(--accent);border-color:var(--accent)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;border-top:1px solid var(--line);margin-top:18px}
.zone{padding:22px 32px 30px;display:flex;flex-direction:column;gap:22px;min-width:0}
.zone:first-child{padding-left:0}
.zone:last-child{padding-right:0}
.zone+.zone{border-left:1px solid var(--line)}
.zh{display:flex;align-items:center;gap:10px;font:600 16px var(--f-hw);letter-spacing:-.01em;color:var(--ink)}
.gline{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding:14px 0;font-size:13.5px;color:var(--mute);flex-wrap:wrap}
.gline .zh{color:var(--mute);font-size:15px}
.gline .selbtn{width:auto;min-width:260px;font-size:14px;border-bottom-color:var(--line)}
.gbody{padding:0 0 24px}

/* ---------- bar ---------- */
.bar{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));position:relative;z-index:8}
.vp-phone .bar{padding-bottom:16px}
.bari{display:flex;align-items:center;gap:6px}
.vp-desktop .bari{max-width:1240px;margin:0 auto;padding:0 max(16px,min(48px,4vw));gap:8px}
.ib{height:44px;min-width:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--ink-2);padding:0 10px;font-size:14px;white-space:nowrap}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib.del:hover{color:var(--danger);background:var(--danger-soft)}
.pri{min-width:0;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;flex:1;white-space:nowrap}
.pri:hover{filter:brightness(1.07)}
.pri.clean{background:var(--sunk);color:var(--mute);font-weight:500}
.sec{height:44px;border-radius:10px;border:1px solid var(--line-2);font-weight:500;padding:0 16px;flex:1;white-space:nowrap;color:var(--ink)}
.sec:hover{border-color:var(--ink-2)}
.vp-desktop .bari .pri,.vp-desktop .bari .sec{flex:0 0 auto;min-width:200px}
.vp-desktop .bari .sp{flex:1}
kbd{font:500 10.5px var(--f-mono);color:var(--faint);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;line-height:15px}
.pri kbd{color:inherit;opacity:.7;border-color:currentColor}
.vp-phone kbd{display:none}
.stseg{display:flex;border:1px solid var(--line-2);border-radius:10px;height:44px;overflow:hidden;flex:none}
.stseg button{padding:0 9px;font-size:13.5px;color:var(--mute)}
.stseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dirty::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* popovers + menus */
.pop{position:absolute;z-index:30;right:12px;bottom:70px;min-width:230px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.vp-desktop .pop{right:max(16px,calc((100% - 1240px)/2 + 48px))}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:8px;font-size:14px;text-align:left;color:var(--ink)}
.pop button:hover{background:var(--sunk)}
.pop button .sp{flex:1}
.pop button.danger{color:var(--danger)}
.pop .q{padding:10px 10px 4px;font-size:14px}
.pop .q small{display:block;color:var(--mute);font-size:12.5px;padding-top:2px}
.pop .two{display:flex;gap:6px;padding:8px 4px 4px}
.pop .two button{justify-content:center;border:1px solid var(--line-2)}
.pop .two button.danger{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.menu{position:absolute;z-index:36;min-width:170px;max-width:min(300px,calc(100% - 24px));max-height:320px;overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--shadow);padding:5px}
.menu.up{transform:translateY(-100%)}

 pos:{l:'Part of speech',o:POS.map(t=>[t,t])},

 missing:{l:'Missing',o:[['ipa','No IPA'],['tr','No translation'],['ex','No examples'],['lemma','No lemma']]},

function pickDef(k){
 const n=cur();
 if(k==='pos') return {h:'Part of speech',o:[['','—'],...POS.map(t=>[t,t]),['__c','custom…']],get:()=>n.pos,set:v=>{if(v==='__c'){S.customPos=true;return;}n.pos=v;S.customPos=false;delete n.prov.pos;dirty();}};
 if(k==='type') return {h:'Type',o:TYPES.map(t=>[t,t]),get:()=>n.type,set:v=>{n.type=v;dirty();}};
 if(k.startsWith('trl:')){const i=+k.slice(4);return {h:'Language',o:LANGS.map(l=>[l,l]),get:()=>n.tr[i].lang,set:v=>{n.tr[i].lang=v;dirty();}};}
 if(k==='rule') return {h:'Grammar rule',o:[['','No rule linked'],...RULES.map(r=>[r.id,r.t])],get:()=>n.rule,set:v=>{n.rule=v;dirty();}};
 if(k==='queue') return {h:'Queue',o:QUEUES.map(q=>[q[0],`${q[1]} · ${q[2]}`]),get:()=>S.queue,set:v=>{S.queue=v;S.qtot=QUEUES.find(q=>q[0]===v)[2];S.qpos=1;S.qi=0;S.tab='word';toast('Queue: '+QUEUES.find(q=>q[0]===v)[1]);}};
 if(k==='sort') return {h:'Sort by',o:SORTS,get:()=>S.sort,set:v=>{S.sort=v;}};
 if(k.startsWith('f:')){const f=k.slice(2),D=FDEF[f];return {h:D.l,o:D.o,multi:!D.single,get:()=>S.F[f],set:v=>fToggle(f,v)};}
}

function sheetShell(label,title,inner,foot=''){

function sheet(){
 if(!S.sheet) return '';

  if(!list.length) body+=`<div class="none">Nothing for “${esc(pqv)}”</div>`;
  const L=(k==='translations'||k==='audio'||k==='pos')?ordered(n,list):list;
  L.forEach(c=>body+=candRow(n,k,p,c,list.indexOf(c)));
  body+='</div>';
 });
 const off=S.prov[k].filter(p=>S.off[k+':'+p]);
 if(k==='audio'){
  const links=S.prov.audio.filter(p=>LINKP.includes(p));
  body+=`<div class="ext"><span class="t">Open elsewhere</span>${links.map(p=>`<a href="${p==='forvo'?'https://forvo.com/search/'+encodeURIComponent(q)+'/no/':'https://filmot.com/search/'+encodeURIComponent(q)+'/1?lang=no'}" target="_blank" rel="noopener">${p}<span class="sp"></span>${ic('ext')}</a>`).join('')}</div>
   <div class="aacts"><button class="lnk" data-act="clip">${ic('clip')} Use URL from clipboard</button><button class="lnk" data-act="upload">${ic('up')} Upload file</button></div>`;
 }
 body+=`<div class="shf">Order follows Settings · <button data-act="go" data-v="settings">Provider order</button>${off.length?` · ${off.length} switched off`:''}</div>`;
 return sheetShell(KINDS[k]+' suggestions',KINDS[k],`<div class="shq"><input class="in" id="shq" data-f="q" value="${esc(q)}" aria-label="Shared query" spellcheck="false"><button class="ib ${S.sheet.spin?'spin':''}" data-act="rerun" aria-label="Run all providers again">${ic('rerun')}</button></div><div class="shb">${body}</div>`);

function used(n,k,c){
 if(k==='translations') return n.tr.some(t=>t.text===c.v&&t.lang===c.lang);
 if(k==='examples') return n.ex.includes(c.v);
 if(k==='pos') return n.pos===c.v;
 if(k==='ipa') return c.asm?n.ipa===c.v:(' '+n.ipa+' ').includes(' '+c.v+' ');
 if(k==='inflections') return Object.keys(c.v).every(x=>n.infl[x]===c.v[x]);
 if(k==='stt') return n.text===c.v;
 if(k==='audio') return hasA(n)&&n.audio.from===c.prov&&n.audio.dur===c.dur;
 return false;
}
function candRow(n,k,p,c,i){
 c.prov=p; const u=used(n,k,c);
 const pm=(n.pos&&c.pos===n.pos&&(k==='translations'||k==='audio'))?`<span class="pm" title="matches ${n.pos}">${POSAB[n.pos]||n.pos}</span>`:'';
 const btn=`<button class="use ${u?'done':''}" data-act="use" data-p="${p}" data-i="${i}">${u?'Used':(k==='ipa'&&c.asm?'Replace':'Use')}</button>`;
 if(k==='inflections') return `<div class="cd inf"><div class="v"><table class="mt">${Object.entries(c.v).map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join('')}</table>${c.ctx?`<small>${esc(c.ctx)}</small>`:''}</div>${btn}</div>`;
 if(k==='audio') return `<div class="cd"><button class="pl" data-act="cplay" aria-label="Play">${ic('play')}</button><div class="v"><b>${esc(c.ctx||p)}</b>${pm}<small>${c.dur.toFixed(2)} s</small></div>${btn}</div>`;
 const v=k==='ipa'?`<b class="ipa">${esc(c.v)}</b>`:`<b>${esc(c.v)}</b>`;
 const lead=k==='translations'?`<span class="lg">${c.lang}</span>`:'';
 return `<div class="cd ${c.asm?'asm':''}">${lead}<div class="v">${v}${pm}${c.ctx?`<small>${esc(c.ctx)}</small>`:''}</div>${btn}</div>`;
}
const TAKES=[['text','Text'],['lemma','Lemma'],['pos','Part of speech'],['infl','Inflections'],['audio','Audio'],['ipa','IPA'],['tr','Translations'],['ex','Examples']];
function tval(o,k){if(k==='tr')return o.tr.map(t=>t.lang+' '+t.text).join(', ');if(k==='ex')return o.ex.join(' · ');if(k==='infl')return Object.values(o.infl).join(' · ');if(k==='audio')return hasA(o)?(o.audio.from||'audio')+' · '+o.audio.dur.toFixed(2)+' s':'';if(k==='ipa')return o.ipa?'/'+o.ipa+'/':'';return o[k]||'';}
function simSheet(n){

 const body=sim.map(o=>{
  const open=sh.open==o.id, tk=sh.take||{}, into=sh.dir!=='out';

   <button class="pri mergebtn" data-act="merge" data-v="${o.id}">Merge ${cnt} field${cnt===1?'':'s'} · keep “${esc(keep.text)}”</button></div>`:''}</div>`;}).join('');

/* ---------------- notes list ---------------- */
function fToggle(f,v){const D=FDEF[f];if(D.single)S.F[f]=(S.F[f]===v&&v!=='any')?'any':v;else{const a=S.F[f];const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);}}
function filtered(){
 const F=S.F,q=S.q.toLowerCase();
 const W={today:1440,week:10080,month:43200};
 const miss={ipa:n=>!n.ipa,tr:n=>!n.tr.length,ex:n=>!n.ex.length,lemma:n=>!n.lemma};
 let L=ALL().filter(n=>!n.isNew).filter(n=>
  (F.status==='any'||n.status===F.status)&&(!F.type.length||F.type.includes(n.type))&&(!F.pos.length||F.pos.includes(n.pos))&&
  (!F.origin.length||F.origin.includes(n.origin))&&(F.audio==='any'||(F.audio==='has')===hasA(n))&&
  F.missing.every(m=>miss[m](n))&&(F.within==='any'||n.updMin<=W[F.within])&&
  (!q||n.text.toLowerCase().includes(q)||n.tr.some(t=>t.text.toLowerCase().includes(q))));
 const cmp={updated:(a,b)=>a.updMin-b.updMin,created:(a,b)=>a.created-b.created,az:(a,b)=>a.text.localeCompare(b.text,'nb'),complete:(a,b)=>completeness(a)-completeness(b)}[S.sort];
 return L.sort(cmp);
}
function activeChips(){
 const out=[];
 for(const f in FDEF){const D=FDEF[f];
  if(D.single){if(S.F[f]!=='any')out.push([f,S.F[f],(f==='status'?'':'')+D.o.find(o=>o[0]===S.F[f])[1].toLowerCase()]);}
  else S.F[f].forEach(v=>out.push([f,v,D.o.find(o=>o[0]===v)[1].toLowerCase()]));}
 return out;
}

/* ---------------- main render ---------------- */
const PAGES=[['triage','Triage'],['note','Note'],['new','New note'],['notes','Notes'],['settings','Settings'],['grammar','Grammar']];
const dev=document.getElementById('device');
function render(keepScroll){
 document.documentElement.classList.toggle('vp-phone',S.vp==='phone');
 document.documentElement.classList.toggle('vp-desktop',S.vp==='desktop');
 document.getElementById('mPages').innerHTML=PAGES.map(([k,l])=>`<button data-pg="${k}" aria-pressed="${S.page===k}">${l}</button>`).join('');
 document.querySelectorAll('#mVp button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.vp===S.vp));
 applyLook();
 const sc=dev.querySelector('.scroll'), st=keepScroll&&sc?sc.scrollTop:0;
 const shb=dev.querySelector('.shb'), shst=shb?shb.scrollTop:0;
 const ctx=['triage','note','new'].includes(S.page)?S.page:null;
 const navAt={triage:'triage',note:'notes',new:'notes',notes:'notes',settings:'settings',grammar:'grammar'}[S.page];
 const top=`<div class="wrap"><div class="top"><span class="wm">stabbur<i>.</i></span><nav class="nav">${[['triage','Triage'],['notes','Notes'],['grammar','Grammar'],['settings','Settings']].map(([k,l])=>`<button data-act="go" data-v="${k}" ${navAt===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav></div></div>`;
 const main=ctx?editor(ctx):S.page==='notes'?notesPage():S.page==='settings'?settingsPage():grammarPage();
 dev.innerHTML=`<div class="scroll" id="scroll">${top}${main}</div>${ctx?bar(ctx):''}${pop()}${sheet()}${menuHtml()}<div class="toast" id="toast"></div>`;
 if(keepScroll) dev.querySelector('.scroll').scrollTop=st;
 const nb=dev.querySelector('.shb'); if(nb&&S.sheet&&!S.sheet.anim) nb.scrollTop=shst;
 if(S.sheet) S.sheet.anim=false; // the open animation runs once, on first render only
 autosize(); bindDrag(); bindWave();
}
function autosize(){dev.querySelectorAll('textarea.in,textarea.hw,textarea.ttl').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px';});}
function refresh(){const n=cur();if(!n)return;dev.querySelectorAll('[data-mk]').forEach(el=>el.innerHTML=mkr(el.dataset.mk,n));}
let tt;function toast(m){const t=dev.querySelector('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900);}
function dirty(){if(S.page!=='note')return;if(!S.dirty){S.dirty=true;const b=dev.querySelector('#savebtn');if(b){b.classList.remove('clean');b.innerHTML='<span class="dirty"></span>Save';}}}
function openSheet(o){S.sheet=Object.assign({anim:true},o);S.pick=null;}

/* ---------------- actions ---------------- */
function useCand(p,i){
 const n=cur(),k=S.sheet.kind,c=n.c[k][p][i];
 if(k==='pos'){n.pos=c.v;}
 else if(k==='ipa'){n.ipa=c.asm?c.v:(n.ipa.trim()?n.ipa.trim()+' '+c.v:c.v);}
 else if(k==='translations'){n.tr.push({lang:c.lang,text:c.v});}
 else if(k==='examples'){n.ex.push(c.v);}
 else if(k==='inflections'){n.infl={...n.infl,...c.v};}
 else if(k==='audio'){n.audio={from:p,dur:c.dur,a:.1,b:.9,seed:i+p.length};}
 else if(k==='stt'){n.text=c.v;}
 n.prov[k]=p; dirty();
 if(['pos','inflections','audio','stt'].includes(k)) S.sheet=null;
 render(true); toast((k==='ipa'&&!c.asm?'Appended':'Used')+' from '+p);
}
function advance(d,msg){S.qi=(S.qi+d+NOTES.length)%NOTES.length;S.qpos=Math.max(1,Math.min(S.qtot,S.qpos+d));S.tab='word';S.menu=null;S.confirm=null;S.sheet=null;render();if(msg)toast(msg);}
function prefill(){
 const n=cur(); let f=0;
 const first=k=>{for(const {p,list} of cands(n,k)){const L=ordered(n,list).filter(c=>!c.asm);if(L.length)return {p,c:L[0]};}return null;};
 if(!n.pos){const r=first('pos');if(r){n.pos=r.c.v;n.prov.pos=r.p;f++;}}
 if(isPara(n)&&!PARA[n.pos].every(k=>n.infl[k])){const r=first('inflections');if(r){n.infl={...r.c.v};n.prov.inflections=r.p;f++;}}
 if(!n.ipa){const src=(n.c.ipa||{})['smia-ipa']||[];const asm=src.find(c=>c.asm);const r=asm?{p:'smia-ipa',c:asm}:first('ipa');if(r){n.ipa=r.c.v;n.prov.ipa=r.p;f++;}}
 if(!n.tr.length){const r=first('translations');if(r){n.tr.push({lang:r.c.lang,text:r.c.v});n.prov.translations=r.p;f++;}}
 if(!n.ex.length){const r=first('examples');if(r){n.ex.push(r.c.v);n.prov.examples=r.p;f++;}}
 if(!hasA(n)){const r=first('audio');if(r){n.audio={from:r.p,dur:r.c.dur,a:.1,b:.9,seed:4};n.prov.audio=r.p;f++;}}
 if(f)dirty();
 S.prefilling=true;S.menu=null;render(true);
 setTimeout(()=>{S.prefilling=false;render(true);toast(f?`Prefilled ${f} empty field${f>1?'s':''}`:'Nothing empty to prefill');},450);
}
let playing=null;
function playSel(btn){
 const n=cur(),a=n.audio;if(!a)return;
 if(playing){cancelAnimationFrame(playing);playing=null;btn.innerHTML=ic('play');const p=dev.querySelector('#phd');if(p)p.setAttribute('x',-10);return;}
 btn.innerHTML=ic('pause');const t0=performance.now(),len=(a.b-a.a)*a.dur*1000;
 const step=t=>{const f=Math.min(1,(t-t0)/len),p=dev.querySelector('#phd');if(p)p.setAttribute('x',(a.a+(a.b-a.a)*f)*640-1);
  if(f<1)playing=requestAnimationFrame(step);else{playing=null;btn.innerHTML=ic('play');if(p)p.setAttribute('x',-10);}};
 playing=requestAnimationFrame(step);
}
function bindWave(){
 const w=dev.querySelector('#wv');if(!w)return;
 let h=null;
 const frac=e=>{const r=w.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));};
 const move=e=>{if(!h)return;const a=cur().audio,f=frac(e);if(h==='a')a.a=Math.min(f,a.b-.05);else a.b=Math.max(f,a.a+.05);w.innerHTML=wave(a);dev.querySelector('#arng').textContent=ms(a);dirty();};
 w.addEventListener('pointerdown',e=>{const a=cur().audio,f=frac(e);h=Math.abs(f-a.a)<Math.abs(f-a.b)?'a':'b';w.setPointerCapture(e.pointerId);move(e);});
 w.addEventListener('pointermove',move);
 w.addEventListener('pointerup',()=>h=null);
}
function bindDrag(){
 dev.querySelectorAll('.plist').forEach(ul=>{
  const sync=()=>{S.prov[ul.dataset.kind]=[...ul.children].map(li=>li.dataset.p);[...ul.children].forEach((li,i)=>li.querySelector('.o').textContent=i+1);};
  ul.querySelectorAll('.h').forEach(h=>{
   const li=h.parentElement;
   h.addEventListener('pointerdown',e=>{e.preventDefault();h.setPointerCapture(e.pointerId);li.classList.add('drag');
    const mv=ev=>{const sibs=[...ul.children].filter(x=>x!==li);const after=sibs.find(s=>{const r=s.getBoundingClientRect();return ev.clientY<r.top+r.height/2;});ul.insertBefore(li,after||null);};
    const up=()=>{li.classList.remove('drag');h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);sync();toast('Order saved');};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);});
   h.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&li.previousElementSibling){ul.insertBefore(li,li.previousElementSibling);sync();h.focus();e.preventDefault();}
    if(e.key==='ArrowDown'&&li.nextElementSibling){ul.insertBefore(li.nextElementSibling,li);sync();h.focus();e.preventDefault();}});
  });
 });
}
function go(p){S.page=p;S.sheet=null;S.menu=null;S.confirm=null;S.pick=null;S.tab='word';S.customPos=false;if(p!=='grammar')S.gr=null;if(p==='note')S.dirty=false;render();}
function preTake(o){const n=cur(),into=S.sheet.dir!=='out',from=into?o:n,keep=into?n:o,t={};
 TAKES.forEach(([k])=>{const mine=tval(keep,k),theirs=tval(from,k);t[k]=!!theirs&&(!mine||k==='tr'||k==='ex')&&mine!==theirs;});S.sheet.take=t;}
function doMerge(id){
 const o=byId(id),n=cur(),t=S.sheet.take,into=S.sheet.dir!=='out';
 const from=into?o:n, keep=into?n:o; let c=0;
 if(t.text&&from.text){keep.text=from.text;c++;} if(t.lemma&&from.lemma){keep.lemma=from.lemma;c++;}
 if(t.pos&&from.pos){keep.pos=from.pos;c++;}
 if(t.infl&&Object.keys(from.infl).length){keep.infl={...from.infl};c++;}
 if(t.audio&&hasA(from)){keep.audio=JSON.parse(JSON.stringify(from.audio));c++;}
 if(t.ipa&&from.ipa){keep.ipa=from.ipa;keep.prov.ipa='merge';c++;} // merge REPLACES IPA
 if(t.tr){from.tr.forEach(x=>{if(!keep.tr.some(y=>y.text===x.text&&y.lang===x.lang))keep.tr.push({...x});});c++;}
 if(t.ex){from.ex.forEach(x=>{if(!keep.ex.includes(x))keep.ex.push(x);});c++;}
 from.gone=true; keep.sim=keep.sim.filter(x=>x!==from.id);
 S.sheet=null;
 if(into){dirty();render(true);toast(`Merged ${c} field${c===1?'':'s'} · “${from.text}” removed`);return;}
 if(S.page==='triage'){const i=NOTES.indexOf(n);NOTES.splice(i,1);S.qtot--;S.qi=S.qi%NOTES.length;S.tab='word';render();toast(`Merged into “${keep.text}” · this note removed`);return;}
 S.noteId=keep.id;S.page='note';S.dirty=false;render();toast(`Merged into “${keep.text}” · opened it`);
}

document.addEventListener('click',e=>{
 const pg=e.target.closest('[data-pg]'); if(pg){go(pg.dataset.pg);return;}
 const vp=e.target.closest('[data-vp]'); if(vp){S.vp=vp.dataset.vp;S.pick=null;render();measure();return;}
 if(!dev.contains(e.target))return;
 const b=e.target.closest('[data-act]');
 if(!b){if(S.menu||S.confirm||S.pick){S.menu=S.confirm=S.pick=null;render(true);}return;}
 const a=b.dataset.act,v=b.dataset.v,n=cur();
 if((S.menu||S.confirm)&&!b.closest('.pop')&&!['menu','t-del','n-del'].includes(a)){S.menu=S.confirm=null;}
 if(S.pick&&a!=='pickv'&&a!=='pick'){S.pick=null;}
 switch(a){
  case 'go':go(v);break;
  case 'tab':S.tab=v;render(true);break;
  case 'pick':{if(S.pick&&S.pick.k===b.dataset.pick){S.pick=null;}else openPick(b);render(true);break;}
  case 'pickv':{const D=pickDef(S.pick.k);D.set(v);if(!D.multi)S.pick=null;render(true);break;}
  case 'pos':n.pos=n.pos===v?'':v;S.customPos=false;delete n.prov.pos;dirty();render(true);break;
  case 'poscustom':S.customPos=true;render(true);dev.querySelector('#f_posc')?.focus();break;
  case 'sheet':openSheet({kind:b.dataset.kind,q:b.dataset.kind==='stt'?'current audio':(S.settings.qprefill?(n.lemma||n.text):''),pq:{},pqOpen:{}});render(true);break;
  case 'close':S.sheet=null;render(true);break;
  case 'rerun':S.sheet.spin=1;render(true);setTimeout(()=>{if(S.sheet){S.sheet.spin=0;render(true);const ov=Object.keys(S.sheet.pq).filter(p=>S.sheet.pq[p]!==S.sheet.q).length;toast(`Ran ${cands(n,S.sheet.kind).length} providers${ov?` · ${ov} with its own query`:''}`);}},650);break;
  case 'pqedit':{const p=b.dataset.p;S.sheet.pqOpen[p]=!S.sheet.pqOpen[p];render(true);if(S.sheet.pqOpen[p])dev.querySelector(`[data-f="pq"][data-p="${p}"]`)?.focus();break;}
  case 'pqreset':{const p=b.dataset.p;delete S.sheet.pq[p];S.sheet.pqOpen[p]=false;render(true);toast(p+' uses the shared query again');break;}
  case 'prerun':{const p=b.dataset.p;S.sheet.pspin=p;render(true);setTimeout(()=>{if(S.sheet){S.sheet.pspin=null;render(true);toast(`Ran ${p} with “${S.sheet.pq[p]??S.sheet.q}”`);}},650);break;}
  case 'use':useCand(b.dataset.p,+b.dataset.i);break;
  case 'cplay':b.innerHTML=ic('pause');setTimeout(()=>{b.innerHTML=ic('play');},900);break;
  case 'play':playSel(b);break;
  case 'tradd':n.tr.push({lang:'en',text:''});dirty();render(true);{const A=dev.querySelectorAll('[data-f="trt"]');A[A.length-1]?.focus();}break;
  case 'trdel':n.tr.splice(+b.dataset.i,1);dirty();render(true);break;
  case 'exadd':n.ex.push('');dirty();render(true);{const A=dev.querySelectorAll('[data-f="ex"]');A[A.length-1]?.focus();}break;
  case 'exdel':n.ex.splice(+b.dataset.i,1);dirty();render(true);break;
  case 'clip':n.audio={from:'url · nrk.no/…/lyd-4471.mp3',dur:2.4,a:.2,b:.7,seed:7.3};n.prov.audio='clipboard';S.clipNote=true;dirty();S.sheet=null;render(true);toast('Captured from clipboard');break;
  case 'upload':document.getElementById('fileIn').click();break;
  case 'similar':openSheet({kind:'similar',open:v?+v:null,take:{},dir:'in'});if(v)preTake(byId(+v));render(true);break;
  case 'mergeopen':if(S.sheet.open==v)S.sheet.open=null;else{S.sheet.open=+v;preTake(byId(+v));}render(true);break;
  case 'mdir':S.sheet.dir=v;preTake(byId(S.sheet.open));render(true);break;
  case 'take':S.sheet.take[v]=!S.sheet.take[v];render(true);break;
  case 'merge':doMerge(+v);break;
  case 'simopen':S.noteId=+v;go('note');toast('Opened '+byId(+v).text);break;
  case 'menu':S.menu=S.menu?null:(S.page==='triage'?'triage':'note');S.confirm=null;render(true);break;
  case 't-del':case 'n-del':S.menu=null;S.confirm='delete';render(true);break;
  case 'cancel':S.confirm=null;render(true);break;
  case 'del-yes':S.confirm=null;if(S.page==='triage'){S.qtot--;advance(0,'Deleted “'+n.text+'”');}else{n.gone=true;go('notes');toast('Deleted “'+n.text+'”');}break;
  case 't-ready':n.status='ready';advance(1,'“'+n.text+'” is ready');break;
  case 't-skip':advance(1,'Skipped');break;
  case 't-prev':advance(-1,'Back to previous');break;
  case 't-back':advance(1,'Sent to the back of the queue');break;
  case 't-save':S.menu=null;render(true);toast('Saved');break;
  case 'prefill':prefill();break;
  case 'status':n.status=v;dirty();render(true);break;
  case 'save':S.dirty=false;render(true);toast('Saved');break;
  case 'dup':{const c=JSON.parse(JSON.stringify(n));c.id=++nid;c.status='draft';c.copyOf=n.text;c.upd='now';c.updMin=0;c.created=0;c.sim=[];c.isNew=0;OTHER.push(c);S.noteId=c.id;S.menu=null;S.dirty=false;S.page='note';render();toast('Duplicated — opened copy');break;}
  case 'new-save':n.status=v;n.isNew=0;S.noteId=n.id;S.page='note';S.dirty=false;
   {const nn=mk({type:'word',upd:'now',isNew:1,c:{}});OTHER.push(nn);S.newId=nn.id;} render();toast(v==='ready'?'Saved as ready':'Saved as draft');break;
  case 'open':S.noteId=+v;go('note');break;
  case 'fsheet':openSheet({kind:'filters'});render(true);break;
  case 'fset':fToggle(b.dataset.k,v);render(true);break;
  case 'sortset':S.sort=v;render(true);break;
  case 'frm':{const f=b.dataset.k;if(FDEF[f].single)S.F[f]='any';else S.F[f]=S.F[f].filter(x=>x!==v);render(true);break;}
  case 'freset':S.F={status:'any',type:[],pos:[],origin:[],audio:'any',missing:[],within:'any'};S.sort='updated';render(true);break;
  case 'triage-these':S.queue='all';S.qtot=filtered().length||1;S.qpos=1;go('triage');toast('Triaging the current filter');break;
  case 'set':S.settings[b.dataset.k]=v;applyLook();render(true);toast('Saved');break;
  case 'step':{const k=b.dataset.k;S.settings[k]=Math.max(1,Math.min(10,S.settings[k]+ +v));render(true);break;}
  case 'qpre':S.settings.qprefill=!S.settings.qprefill;render(true);break;
  case 'poff':{const key=b.dataset.k+':'+v;S.off[key]=!S.off[key];render(true);break;}
  case 'gr':S.gr=v;S.gedit=false;render();break;
  case 'gedit':S.gedit=!S.gedit;render(true);break;
  case 'tdup':{const c=JSON.parse(JSON.stringify(n));c.id=++nid;c.status='draft';c.copyOf=n.text;c.upd='now';c.updMin=0;c.sim=[];NOTES.splice(S.qi+1,0,c);S.qtot++;S.menu=null;render(true);toast('Duplicated — the copy is next in the queue');break;}
  case 'grback':S.gr=null;render();break;
  case 'openrule':S.page='grammar';S.gr=v;S.sheet=null;render();break;
  case 'toast':toast(v);break;
 }
});
document.addEventListener('input',e=>{
 const el=e.target,f=el.dataset.f;if(!f)return;const n=cur();
 if(f==='search'){S.q=el.value;const pos=el.selectionStart;render(true);const s=dev.querySelector('#srch');s.focus();s.setSelectionRange(pos,pos);return;}
 if(f==='q'){S.sheet.q=el.value;return;}
 if(f==='pq'){S.sheet.pq[el.dataset.p]=el.value;return;}
 if(f==='valc'){S.settings.custom=el.value;S.settings.val='custom';applyLook();el.parentElement.style.setProperty('--c',el.value);dev.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x.classList.contains('swc')));return;}
 if(f==='ghtml'){RULES.find(r=>r.id===el.dataset.v).b=el.value;return;}
 if(!n)return;
 if(f==='text'){n.text=el.value.replace(/\n/g,' ');if(!CSS.supports('field-sizing','content')){el.style.height='auto';el.style.height=el.scrollHeight+'px';}} else if(f==='lemma')n.lemma=el.value; else if(f==='ipa')n.ipa=el.value;
 else if(f==='posc'){n.pos=el.value.trim();}
 else if(f==='infl')n.infl[el.dataset.k]=el.value;
 else if(f==='trt')n.tr[+el.dataset.i].text=el.value;
 else if(f==='ex'){n.ex[+el.dataset.i]=el.value;el.style.height='auto';el.style.height=el.scrollHeight+'px';}
 dirty();refresh();
});
dev.addEventListener('scroll',()=>{if(S.pick){S.pick=null;dev.querySelector('.menu')?.remove();}},true);
document.getElementById('fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const n=cur();n.audio={from:'upload · '+f.name,dur:1.8,a:.05,b:.95,seed:f.size%9};n.prov.audio='upload';S.sheet=null;dirty();render(true);toast('Uploaded '+f.name);e.target.value='';});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('hw')){e.preventDefault();return;}
 if(e.key==='Escape'&&(S.sheet||S.menu||S.confirm||S.pick)){S.sheet=S.menu=S.confirm=S.pick=null;render(true);return;}
 if(S.page!=='triage'||S.sheet||S.confirm||e.metaKey||e.ctrlKey||e.altKey)return;
 if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 const map={d:'t-del',s:'t-skip',t:'t-prev',r:'t-ready',e:'t-back',m:'t-save',l:'prefill'};
 const act=map[e.key.toLowerCase()];if(!act)return;e.preventDefault();
 const fake=document.createElement('button');fake.dataset.act=act;fake.hidden=true;dev.appendChild(fake);fake.click();fake.remove();
});
function measure(){document.documentElement.style.setProperty('--mockh',document.getElementById('mock').offsetHeight+'px');}
addEventListener('resize',measure);
function applyLook(){const r=document.documentElement,s=S.settings;if(s.theme==='auto')delete r.dataset.theme;else r.dataset.theme=s.theme;r.dataset.val=s.val;if(s.val==='custom')r.style.setProperty('--val',s.custom);else r.style.removeProperty('--val');}
render();measure();
})();
</script>
